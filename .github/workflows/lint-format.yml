name: Lint and Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (Check Only)
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Run ESLint
        run: npx eslint "**/*.{ts,tsx}" 